<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkillRise Academy is a non-profit offering free online courses in AI, graphic design, digital marketing, English, journalism and more." />
    <meta property="og:title" content="SkillRise Academy — Free skills for a better future" />
    <meta property="og:description" content="Free, high-quality online courses taught by industry practitioners." />
    <meta property="og:image" content="/logo.png" />
    <meta name="theme-color" content="#0056d2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Mirrors detectLang() in src/lib/i18n.jsx so RTL visitors don't see an LTR flash before React loads. -->
    <script>
      (function () {
        var l = null
        try { l = localStorage.getItem('skillrise.lang') } catch (e) {}
        if (l !== 'en' && l !== 'fa') {
          l = null
          var langs = navigator.languages || [navigator.language]
          for (var i = 0; i < langs.length && !l; i++) {
            var c = (langs[i] || '').slice(0, 2)
            if (c === 'en' || c === 'fa') l = c
          }
        }
        if (l === 'fa') { document.documentElement.lang = 'fa'; document.documentElement.dir = 'rtl' }
      })()
    </script>
    <title>SkillRise Academy — Free Online Skills Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
